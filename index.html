<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beispiel App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #4338ca, #22c55e);
      }

      .card {
        width: min(90vw, 420px);
        padding: 2rem;
        border-radius: 1rem;
        background: color-mix(in srgb, canvas 85%, transparent);
        box-shadow: 0 16px 32px rgb(0 0 0 / 0.2);
        text-align: center;
      }

      h1 {
        margin-top: 0;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }

      #count {
        font-size: 2rem;
        font-weight: 700;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Beispiel App</h1>
      <p>Ein kleiner Klickzähler als Startpunkt.</p>
      <div id="count" aria-live="polite">0</div>
      <button id="increment">Klick mich</button>
    </main>

    <script>
      const countNode = document.getElementById('count');
      const button = document.getElementById('increment');
      let count = 0;

      button.addEventListener('click', () => {
        count += 1;
        countNode.textContent = String(count);
      });
    </script>
  </body>
</html>
